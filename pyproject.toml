[project]
name = "volarb"
version = "0.1.0"
description = "Directional ITM opening-range-breakout options strategy (NIFTY-weekly + MCX Crude), real 1-min backtest."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "breeze-connect",  # ICICI Breeze: data + execution (1-min underlying + per-strike options incl. expired; NSE + MCX)
    "pandas",          # backtest dataframes + Parquet IO
    "numpy",           # array math
    "pyarrow",         # Parquet engine
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volarb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Pin all versions in uv.lock (commit it).
