[project]
name = "volarb"
version = "0.0.1"
description = "Intraday NIFTY straddle/strangle volatility arbitrage (realized-vs-implied spread)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nautilus_trader",   # engine: backtest+live parity, options-native (pin exact v1.x in uv.lock; beta API)
    "vollib",            # options pricing / IV / greeks (Black-76, LetsBeRational)
    "statsmodels",       # HAR-RV via OLS + HAC standard errors (no GARCH)
    "breeze-connect",    # ICICI Breeze: data + execution (1-sec underlying + per-strike options incl. expired)
    "pandas",
    "polars",
    "pyarrow",
    "pydantic",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volarb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Pin all versions in uv.lock (commit it). NautilusTrader v1.x is BETA; expect churn until 2.x.
